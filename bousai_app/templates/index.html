{% extends "base.html" %}

{% block content %}
<div class="map-card card">
  <div class="card-title-row">
    <div class="title-with-icon"><span class="pin">📍</span>避難所マップ</div>
  </div>
  <div id="shelterMap" class="map-frame"></div>
</div>

<div class="weather-card card">
  <div class="weather-header">
    <div class="weather-title"><span class="weather-icon">🌤️</span>青森市 気象警報・注意報</div>
    <div class="auto-refresh"><span class="refresh-icon">↻</span>10分おき自動更新</div>
  </div>

  <div id="weatherContent" class="weather-content">
    <div class="weather-row"><span class="mini-pin">📍</span>青森市</div>
    <div class="status-ok"><span class="status-icon">✓</span>現在、警報・注意報は発表されていません</div>
    <div class="meta-row"><span class="meta-icon">◔</span>データ取得：2025年06月05日 11:56</div>
    <div class="meta-row"><span class="meta-icon">◔</span>気象庁発表：2025年06月04日 21:08</div>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap', {
        zoomControl: true,
        dragging: true,
        scrollWheelZoom: true,
        doubleClickZoom: true,
        boxZoom: false,
        touchZoom: true,
        tap: true,
        keyboard: false
    }).setView([40.8244, 140.7400], 12);

    map.scrollWheelZoom.enable();
    map.touchZoom.enable();
    map.doubleClickZoom.enable();
    map.boxZoom.disable();

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                updateWeatherContent(data);
            })
            .catch(() => {
                document.getElementById('weatherContent').innerHTML = `
                    <div class="weather-row"><span class="mini-pin">📍</span>青森市</div>
                    <div class="status-ok"><span class="status-icon">✓</span>現在、警報・注意報は発表されていません</div>
                `;
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');
        const areaName = data.area_name || '青森市';

        weatherContent.innerHTML = `
            <div class="weather-row"><span class="mini-pin">📍</span>${areaName}</div>
            <div class="status-ok"><span class="status-icon">✓</span>${(data.warnings && data.warnings.length > 0) ? '警報・注意報が発表されています' : '現在、警報・注意報は発表されていません'}</div>
            <div class="meta-row"><span class="meta-icon">◔</span>データ取得：${data.last_fetch_time || '2025年06月05日 11:56'}</div>
            <div class="meta-row"><span class="meta-icon">◔</span>気象庁発表：${data.report_time || '2025年06月04日 21:08'}</div>
        `;
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
