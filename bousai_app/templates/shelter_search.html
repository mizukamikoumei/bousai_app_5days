{% extends "base.html" %}

{% block content %}
<h2>避難所検索</h2>
<p>登録されている避難所を確認できます。</p>

<form action="{{ url_for('search_results') }}" method="GET">
	<p>
		<label for="district">地区名</label><br>
		<input type="text" id="district" name="district" placeholder="例：青森市中央" required>
		<button type="submit">検索</button>
	</p>
</form>

<p><a href="/all_shelters">全施設一覧</a></p>
{% endblock %}
